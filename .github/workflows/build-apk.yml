name: Crea APK Lista Spesa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Scarica i file del progetto
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Controlla il file della lista
        run: |
          if [ ! -f index.html ]; then
            echo "Manca index.html: carica prima il file della lista."
            exit 1
          fi

      - name: Installa Cordova
        run: npm install -g cordova

      - name: Crea il progetto Android
        run: |
          cordova create app com.m78675489.listaspesa "Lista Spesa"
          cp index.html app/www/index.html

      - name: Aggiungi Android
        run: |
          cd app
          yes | cordova platform add android || true

      - name: Crea l'APK
        run: |
          cd app
          cordova build android

            - name: Trova l'APK
        run: |
          find app/platforms -name "*.apk" -print

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: lista-spesa-apk
          path: |
            app/platforms/**/app-debug.apk
            app/platforms/**/*-debug.apk
          if-no-files-found: error
